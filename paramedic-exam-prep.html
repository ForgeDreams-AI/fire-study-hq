{q:"Naloxone's effects are temporary, so after giving it you must:",c:"Monitor closely \u2014 the patient can slip back into overdose",w:["Discharge the patient","Give a second dose immediately","Restrain the patient"],e:"Naloxone wears off before the opioid does \u2014 reassess constantly.",k:14},
{q:"Epinephrine reverses anaphylaxis by:",c:"Stimulating alpha and beta receptors \u2014 bronchodilation, vasoconstriction, increased cardiac output",w:["Blocking histamine receptors","Sedating the patient","Thinning the blood"],e:"Epi is sympathomimetic: alpha (vasoconstriction, less swelling) + beta (bronchodilation, stronger heart).",k:14},
{q:"Which is true about oxygen as a drug?",c:"It corrects hypoxia but does not treat the underlying cause",w:["It cures the underlying disease","It is never indicated in COPD","It replaces ventilations"],e:"Oxygen treats hypoxia, not the cause \u2014 keep looking for why they're hypoxic.",k:14},
/* ---- 15: Rapid extrication ---- */
{q:"Rapid extrication is indicated for all EXCEPT:",c:"Stable patient with isolated ankle fracture in a safe car",w:["Cardiac arrest in the vehicle","Vehicle fire risk","Airway compromise"],e:"Rapid extrication = immediate danger (fire, hazmat, unstable vehicle) or critical patient (arrest, airway, major hemorrhage, shock).",k:15},
{q:"The FIRST step before any extrication is:",c:"Scene safety",w:["C-spine stabilization","Removing the doors","Starting an IV"],e:"Scene safety always comes first \u2014 don't become the second patient.",k:15},
/* ---- 16: Drugs by device ---- */
{q:"A small-volume nebulizer delivers:",c:"Albuterol and ipratropium bromide",w:["Epinephrine","Naloxone","Nitroglycerin"],e:"Nebulizer = albuterol / ipratropium (bronchodilators). Auto-injector = epi. Nasal spray = naloxone.",k:16},
{q:"Naloxone in the EMT scope is given by:",c:"Nasal spray or auto-injector/IM",w:["Small-volume nebulizer","Metered-dose inhaler","Sublingual tablet"],e:"Naloxone: intranasal spray or IM. Albuterol: MDI or nebulizer.",k:16},
/* ---- 17: Drugs by route ---- */
{q:"Nitroglycerin is administered:",c:"Sublingual",w:["Intranasal","Intramuscular","Inhaled"],e:"Nitro = sublingual. Aspirin/glucose/charcoal = oral. Naloxone = intranasal.",k:17},
{q:"Activated charcoal is given:",c:"Orally",w:["Intravenously","Intranasally","Sublingually"],e:"Activated charcoal = oral route (binds ingested poisons in the gut).",k:17},
/* ---- 18: CPR ---- */
{q:"Adult BLS: correct compression depth and two-rescuer ratio are:",c:"2\u20132.4 inches deep, 30:2",w:["1/3 chest depth, 15:2","1.5 inches deep, 15:2","2\u20132.4 inches deep, 15:2"],e:"Adults: 2\u20132.4 in deep, 100\u2013120/min, 30:2 for one AND two rescuers.",k:18},
{q:"The correct adult BLS pulse check site is the:",c:"Carotid artery",w:["Femoral artery","Radial artery","Brachial artery"],e:"Adult/child = carotid (femoral acceptable in children). Infant = brachial.",k:18},
{q:"Infant two-rescuer CPR uses:",c:"Two thumbs on the chest, 15:2",w:["Two fingers, 30:2","One hand, 30:2","Heel of hand, 15:2"],e:"Infant: single rescuer 2 fingers 30:2; two rescuers 2 thumbs 15:2. Depth 1/3 chest.",k:18},
{q:"You should switch compressors every:",c:"2 minutes",w:["5 minutes","10 minutes","30 minutes"],e:"Switch every 2 minutes to avoid fatigue and keep compressions effective.",k:18},
/* ---- 19: Choking ---- */
{q:"For a choking infant, the correct sequence is:",c:"5 back slaps, then 5 chest thrusts, repeat",w:["5 abdominal thrusts only","Blind finger sweeps","Back slaps until crying"],e:"Infant: 5 back slaps + 5 chest thrusts (2 fingers), repeat. Never do blind finger sweeps.",k:19},
{q:"For a choking pregnant patient, use:",c:"Chest thrusts",w:["Abdominal thrusts","Back slaps only","The Heimlich on the lower abdomen"],e:"Pregnant or obese: chest thrusts instead of abdominal thrusts.",k:19},
{q:"A choking adult becomes unresponsive. You should:",c:"Lower to the ground and begin CPR",w:["Continue abdominal thrusts standing","Give rescue breaths only","Check the mouth with blind sweeps"],e:"Unresponsive choking → begin CPR; check the mouth before breaths, remove only visible objects.",k:19},
/* ---- 20: Apgar ---- */
{q:"A newborn at 1 minute: body pink/blue extremities, HR 95, grimace, some flexion, slow irregular respirations. Apgar =",c:"6",w:["5","7","4"],e:"Appearance 1 + Pulse 1 (<100) + Grimace 1 + Activity 1 + Respiration 1 = 6.",k:20},
{q:"In Apgar scoring, slow/irregular respirations score:",c:"1",w:["2","0","3"],e:"Respiration: 0 absent, 1 slow/irregular, 2 strong cry.",k:20},
{q:"A newborn is completely pink, HR 130, crying vigorously, active movement, pulls away from stimulation. Apgar =",c:"10",w:["9","8","7"],e:"All 2s: 2+2+2+2+2 = 10.",k:20},
{q:"Apgar is assessed at:",c:"1 and 5 minutes after birth",w:["Immediately and at 10 minutes","5 and 10 minutes","Only at 1 minute"],e:"Apgar at 1 and 5 minutes; continue every 5 if below 7.",k:20},
/* ---- 21: Suicide ---- */
{q:"The single biggest risk factor for suicide is:",c:"Previous suicide attempt",w:["Being female","Being employed","Having children"],e:"A previous attempt is the strongest predictor of future attempts.",k:21},
{q:"A patient says 'everyone would be better off without me' and has been giving away possessions. Your priority is:",c:"Scene safety and compassionate transport \u2014 take all threats seriously",w:["Leave them alone to calm down","Argue that life is worth living","Have family talk them out of it"],e:"Take every threat seriously; ensure safety, don't leave them alone, transport.",k:21},
/* ---- 22: SMR ---- */
{q:"The FIRST step of spinal motion restriction is:",c:"Take manual C-spine stabilization",w:["Apply the C-collar","Logroll the patient","Check PMS"],e:"Manual stabilization first, held until the patient is fully secured.",k:22},
{q:"PMS checks during SMR stand for:",c:"Pulse, motor, sensory",w:["Pain, movement, strength","Pressure, motion, swelling","Perfusion, mobility, stability"],e:"Check pulse, motor, sensory distal to the injury before and after splinting/securing.",k:22},
/* ---- 23: Newborn suction ---- */
{q:"To suction a newborn, use:",c:"Bulb syringe",w:["Rigid Yankauer catheter","Towel","Your mouth"],e:"Bulb syringe (or soft catheter with suction unit) for newborns.",k:23},
{q:"When suctioning a newborn's airway with a bulb syringe, suction the:",c:"Mouth first, then the nose",w:["Nose first, then the mouth","Trachea directly","Stomach first"],e:"Mouth before nose \u2014 suctioning the nose first can cause aspiration of oral secretions.",k:23},
/* ---- 24: GCS ---- */
{q:"A patient opens eyes to pain, makes incomprehensible sounds, and shows abnormal flexion to pain. GCS =",c:"7",w:["8","6","9"],e:"Eye 2 + Verbal 2 + Motor 3 = 7.",k:24},
{q:"A patient is oriented, obeys commands, and opens eyes spontaneously. GCS =",c:"15",w:["14","13","12"],e:"Eye 4 + Verbal 5 + Motor 6 = 15.",k:24},
{q:"Abnormal extension (decerebrate) posturing scores what on the GCS motor scale?",c:"2",w:["3","4","1"],e:"Motor: 6 obeys, 5 localizes, 4 withdraws, 3 abnormal flexion, 2 abnormal extension, 1 none.",k:24},
{q:"A GCS of 8 or less generally indicates:",c:"Severe brain injury \u2014 consider advanced airway",w:["Mild concussion","Normal mentation","Psychiatric emergency"],e:"GCS \u22648 = severe; the patient likely can't protect their airway.",k:24},
/* ---- 25: Primary assessment ---- */
{q:"The goal of the primary assessment is to:",c:"Identify and manage immediate life threats",w:["Get a full set of vitals","Obtain a detailed history","Splint all fractures"],e:"Primary assessment = find and fix immediate life threats (ABCs).",k:25},
{q:"In the primary assessment, 'D' in ABCDE stands for:",c:"Disability (neurologic status)",w:["Drugs","Deformity","Documentation"],e:"ABCDE: Airway, Breathing, Circulation, Disability, Exposure.",k:25},
/* ---- 26: Ambulance crashes ---- */
{q:"Most serious ambulance crashes occur at:",c:"Intersections",w:["Highways","Hospital ramps","Parking lots"],e:"Intersections are where most serious ambulance crashes happen \u2014 clear them carefully.",k:26},
{q:"When proceeding through a red light with lights and sirens, you should:",c:"Stop, clear each lane, then proceed cautiously",w:["Maintain speed \u2014 you have the right of way","Turn off sirens to avoid panic","Follow another emergency vehicle closely"],e:"You must still ensure the intersection is clear \u2014 lights/sirens request the right of way; they don't guarantee it.",k:26},
/* ---- 27: Needlestick ---- */
{q:"A needlestick with infected blood can transmit:",c:"Hepatitis B and C",w:["Hepatitis A only","Malaria","Tuberculosis"],e:"Bloodborne: Hep B, Hep C, HIV. Hep A is fecal-oral.",k:27},
{q:"After a needlestick exposure, you should FIRST:",c:"Wash the area and report per exposure protocol",w:["Apply a tourniquet","Squeeze the wound to bleed","Ignore it if the patient looks healthy"],e:"Wash immediately and follow your exposure control plan/reporting.",k:27},
/* ---- 28: BVM ---- */
{q:"A BVM is indicated for:",c:"Apnea or inadequate breathing",w:["A patient breathing 20/min with good chest rise","Mild anxiety","Any chest pain"],e:"BVM = apnea or inadequate breathing (too slow/fast, shallow, poor chest rise, low SpO2 despite O2).",k:28},
{q:"The correct BVM ventilation rate for an apneic adult WITH a pulse is:",c:"One breath every 6 seconds",w:["One breath every 3 seconds","Two breaths every 15 compressions","One breath every 10 seconds"],e:"Apneic with pulse: 1 breath every 6 sec (10/min). In cardiac arrest: 30:2 or continuous with advanced airway at 10/min.",k:28},
/* ---- 29: Gastric distention ---- */
{q:"The biggest danger of gastric distention from aggressive BVM ventilation is:",c:"Vomiting and aspiration",w:["Rib fractures","Hyperventilation","Increased blood pressure"],e:"Over-ventilation \u2192 stomach inflation \u2192 vomiting \u2192 aspiration; also reduces lung expansion.",k:29},
{q:"To reduce gastric distention during BVM use:",c:"Ventilate slowly, just enough for visible chest rise",w:["Ventilate as fast as possible","Use maximum force","Remove the OPA"],e:"Slow gentle breaths, only to visible chest rise \u2014 prevents stomach inflation.",k:29},
/* ---- 30: Blood ---- */
{q:"Which blood component carries oxygen?",c:"Red blood cells (erythrocytes)",w:["Platelets","White blood cells","Plasma proteins"],e:"RBCs (erythrocytes) carry oxygen; platelets clot; WBCs fight infection; plasma is the fluid.",k:30},
{q:"Platelets (thrombocytes) are responsible for:",c:"Clotting",w:["Oxygen transport","Immune defense","Nutrient transport"],e:"Platelets = clotting. Aspirin inhibits platelet aggregation.",k:30},
/* ---- 31: Airway unconscious adult ---- */
{q:"An unconscious trauma patient needs their airway opened. You choose:",c:"Jaw thrust",w:["Head tilt\u2013chin lift","Neck extension","Prone positioning"],e:"Suspected spinal injury \u2192 jaw thrust without head extension.",k:31},
{q:"An OPA is contraindicated in a patient who:",c:"Has an intact gag reflex",w:["Is deeply unconscious","Has no gag reflex","Is in cardiac arrest"],e:"OPA with a gag reflex \u2192 vomiting/laryngospasm. OPA is for unconscious WITHOUT gag.",k:31},
{q:"An NPA is contraindicated with:",c:"Suspected basilar skull fracture",w:["An intact gag reflex","Cardiac arrest","Vomiting"],e:"NPA + basilar skull fracture (Battle signs, raccoon eyes, CSF leak) \u2192 risk of passing into the cranial vault.",k:31},
{q:"Correct OPA sizing is measured:",c:"From the corner of the mouth to the earlobe",w:["From the nose to the chin","Across the forehead","From ear to ear"],e:"OPA: corner of mouth \u2192 earlobe. NPA: tip of nose \u2192 earlobe.",k:31},
/* ---- 32: Vertebrae ---- */
{q:"How many cervical vertebrae are there?",c:"7",w:["5","12","3"],e:"C7, T12, L5, sacrum 5 fused, coccyx 3\u20135 fused.",k:32},
{q:"The thoracic spine has how many vertebrae?",c:"12",w:["7","5","10"],e:"Thoracic = 12 (one per rib pair).",k:32},
/* ---- 34: Tourniquet ---- */
{q:"A tourniquet is indicated when:",c:"Life-threatening extremity bleeding can't be controlled with direct pressure",w:["There is any bleeding at all","The patient requests one","Bleeding has already stopped"],e:"Tourniquet = severe extremity hemorrhage uncontrolled by direct pressure.",k:34},
{q:"A properly applied tourniquet should be placed:",c:"2\u20133 inches above the wound, never over a joint",w:["Directly on the wound","Over the knee or elbow","Below the wound"],e:"2\u20133 inches above the bleeding site, not over a joint; tighten until bleeding stops.",k:34},
/* ---- 35: Hypo vs hyper ---- */
{q:"Hypoglycemia develops faster than hyperglycemia because:",c:"The brain needs constant glucose and fails quickly without it",w:["Insulin works instantly","The liver stores no sugar","Kidneys fail first"],e:"Brain can't store glucose \u2014 hypoglycemia hits the brain in minutes; DKA takes hours to days.",k:35},
{q:"A diabetic patient is confused, sweaty, and tachycardic with rapid onset. You suspect:",c:"Hypoglycemia",w:["DKA","Hyperglycemia","Stroke"],e:"Rapid onset + altered LOC + diaphoretic = hypoglycemia until proven otherwise. Check glucose.",k:35},
/* ---- 36: Positional asphyxia ---- */
{q:"Positional asphyxia occurs when:",c:"Body position restricts chest movement so lungs can't expand",w:["The patient holds their breath","Oxygen is removed from the room","The airway is blocked by food"],e:"Prone restraint, entrapment, or compression preventing chest expansion \u2192 hypoxia.",k:36},
{q:"A restrained, prone, highly agitated patient suddenly becomes calm and pulseless. This may be:",c:"Positional asphyxia progressing to arrest",w:["A successful calming","A seizure ending","Normal fatigue"],e:"Prone restraint + agitation \u2192 positional asphyxia; sudden calm can precede arrest.",k:36},
/* ---- 37: Refusal ---- */
{q:"A patient may refuse treatment only if they:",c:"Have decision-making capacity and understand the risks of refusing",w:["Are over 18 regardless of condition","Sign any paper","Have a family member agree"],e:"Refusal requires: capacity, alert/oriented, understands condition/treatment/risks, not impaired, voluntary.",k:37},
{q:"An intoxicated patient with a head injury wants to refuse transport. You should:",c:"Not accept the refusal \u2014 they lack decision-making capacity",w:["Let them sign and leave","Have police force them","Document and walk away"],e:"Impaired by drugs/alcohol/ALOC = no capacity. Involve law enforcement/medical direction as needed.",k:37},
/* ---- 38: Triage ---- */
{q:"In START triage, a patient who is not breathing after opening the airway is tagged:",c:"Black",w:["Red","Yellow","Green"],e:"START: no respirations after airway opened = deceased/expectant (black).",k:38},
{q:"START triage: a walking wounded patient with minor lacerations is tagged:",c:"Green",w:["Yellow","Red","Black"],e:"Green = minor/walking wounded. Yellow = delayed. Red = immediate.",k:38},
{q:"START triage: respirations over 30/min after opening the airway = tag:",c:"Red",w:["Yellow","Green","Black"],e:"START: RR >30 = red (immediate). Then check perfusion (radial pulse/cap refill) and mental status.",k:38},
{q:"A patient with a radial pulse absent and uncontrolled bleeding in a mass-casualty incident is:",c:"Red \u2014 immediate",w:["Yellow \u2014 delayed","Green \u2014 minor","Black \u2014 expectant"],e:"No radial pulse / poor perfusion = red immediate in START.",k:38},
/* ---- 39: Atherosclerosis ---- */
{q:"Atherosclerosis reduces cardiac function in older adults by:",c:"Plaque narrowing arteries, reducing myocardial oxygen supply",w:["Thickening the heart valves","Increasing heart rate permanently","Dilating the coronary arteries"],e:"Plaque \u2192 stenosis \u2192 ischemia, especially on exertion \u2192 weaker pump over time.",k:39},
{q:"Arteries become stiff and less elastic with aging primarily due to:",c:"Progressive plaque buildup over time",w:["High fluid intake","Exercise","Low cholesterol"],e:"Atherosclerosis accumulates over decades, stiffening arteries.",k:39},
/* ---- 40: Trauma categories ---- */
{q:"A stab wound is an example of:",c:"Penetrating trauma",w:["Blunt trauma","Blast injury","Crush injury"],e:"Penetrating = object pierces skin and enters the body.",k:40},
{q:"A fall from a ladder with no skin break is:",c:"Blunt trauma",w:["Penetrating trauma","Thermal trauma","No trauma"],e:"Blunt = forceful impact without breaking the skin.",k:40},
/* ---- 41: Helicopter LZ ---- */
{q:"The minimum landing zone for an EMS helicopter is:",c:"100 ft \u00d7 100 ft",w:["50 ft \u00d7 50 ft","200 ft \u00d7 200 ft","75 ft \u00d7 75 ft"],e:"LZ = 100\u00d7100 ft, flat, level, obstacle-free, firm ground.",k:41},
{q:"When approaching a running helicopter, you should:",c:"Approach from the downhill/upwind side as directed by the crew",w:["Approach from the rear","Run under the tail boom","Approach with lights flashing at night"],e:"Never approach from uphill, the rear, or with bright lights at night unless the pilot directs \u2014 follow crew instructions.",k:41},
/* ---- 42: Appendicular skeleton ---- */
{q:"The humerus, radius, and ulna are part of the:",c:"Upper extremity",w:["Axial skeleton","Pelvic girdle","Skull"],e:"Upper extremity: humerus (upper arm), radius/ulna (forearm).",k:42},
{q:"The femur, tibia, and fibula are part of the:",c:"Lower extremity",w:["Pectoral girdle","Vertebral column","Upper extremity"],e:"Lower extremity: femur (thigh), tibia/fibula (lower leg).",k:42},
{q:"The clavicle and scapula form the:",c:"Pectoral (shoulder) girdle",w:["Pelvic girdle","Rib cage","Carpal bones"],e:"Pectoral girdle = clavicle + scapula.",k:42},
/* ---- 43: Nitro adverse ---- */
{q:"The most common adverse effect of nitroglycerin is:",c:"Headache",w:["Hypertension","Bradycardia","Seizures"],e:"Headache is very common with nitro, plus dizziness, hypotension, reflex tachycardia.",k:43},
{q:"Nitroglycerin causes hypotension because it:",c:"Dilates blood vessels",w:["Constricts arteries","Slows the heart","Thickens the blood"],e:"Nitro = vasodilator \u2192 headache, dizziness, hypotension, reflex tachycardia.",k:43},
{q:"Before giving nitroglycerin, you must confirm:",c:"Systolic BP above 100 and no ED medications",w:["The patient is under 40","A 12-lead is normal","The patient is fasting"],e:"Nitro contraindications: SBP <100, ED meds (sildenafil etc.), right-ventricular infarct.",k:43},
/* ---- 44: Assessment sequence ---- */
{q:"In the assessment sequence, SAMPLE and OPQRST are obtained during:",c:"History taking",w:["Scene size-up","Primary assessment","Reassessment"],e:"Sequence: scene size-up \u2192 primary \u2192 history (SAMPLE/OPQRST) \u2192 secondary \u2192 reassessment.",k:44},
{q:"AVPU is assessed during the:",c:"Primary assessment",w:["Detailed physical exam","Triage tagging","Billing documentation"],e:"Primary: general impression, LOC (AVPU), ABCs/life threats, transport priority.",k:44},
{q:"OPQRST is used to assess:",c:"The patient's chief complaint/pain history",w:["Scene safety","Neurologic disability","The mechanism of injury"],e:"OPQRST: Onset, Provokes/palliates, Quality, Radiates, Severity, Time.",k:44},
/* ---- 45: Breathing ---- */
{q:"The primary reason for breathing is to:",c:"Supply oxygen and remove carbon dioxide",w:["Warm the blood","Pump the heart","Filter the air"],e:"Breathing = oxygen in, carbon dioxide out.",k:45},
{q:"Ventilation without adequate perfusion results in:",c:"Poor gas exchange at the tissues",w:["Perfect oxygenation","Increased cardiac output","Lowered intracranial pressure"],e:"Ventilation moves air; without perfusion (blood flow), oxygen never reaches tissues.",k:45},
/* ---- 46: Skull fractures ---- */
{q:"Raccoon eyes, Battle signs, and CSF leakage indicate:",c:"Basilar skull fracture",w:["Linear skull fracture","Depressed skull fracture","Nasal fracture"],e:"Basilar = base of skull: Battle signs, raccoon eyes, CSF from nose/ears.",k:46},
{q:"A skull fracture with bone pushed inward toward the brain is:",c:"Depressed",w:["Linear","Open","Diastatic"],e:"Depressed = bone pushed inward. Linear = simple crack. Open = skin broken.",k:46},
/* ---- 47: Ambulance positioning ---- */
{q:"At a highway MVC, the ambulance should be positioned:",c:"Downstream of the scene, past it in the direction of traffic",w:["In the middle of the wreckage","Upstream blocking all lanes","Facing oncoming traffic"],e:"Engine blocks upstream; ambulance stages downstream, clear to depart.",k:47},
{q:"The engine is positioned upstream at an MVC primarily to:",c:"Block traffic and protect the scene",w:["Pump water","Transport patients","Direct traffic with headlights"],e:"The engine is the blocker; the ambulance stays downstream for rapid departure.",k:47},
/* ---- 48: Rapport ---- */
{q:"The FIRST thing to do when making patient contact is:",c:"Introduce yourself by name and role",w:["Start an IV","Ask for insurance","Begin the head-to-toe exam"],e:"Introduce yourself, explain what you're doing before you do it, get at eye level.",k:48},
{q:"Therapeutic rapport is best maintained by:",c:"Explaining each step before doing it and involving the patient in decisions",w:["Working silently to save time","Making promises about outcomes","Avoiding eye contact"],e:"Explain before acting, calm tone, respect privacy, keep them informed.",k:48},
/* ---- 49: PTSD ---- */
{q:"Which exposure can contribute to PTSD in EMS providers?",c:"Repeatedly witnessing severe injury, death, or suffering",w:["Routine lift assists","Station chores","Driving the ambulance"],e:"PTSD causes: serious accidents, violence, disasters, witnessing severe injury/death/suffering.",k:49},
/* ---- 50: Brainstem ---- */
{q:"The three structures of the brainstem are:",c:"Midbrain, pons, medulla oblongata",w:["Cerebrum, cerebellum, cortex","Thalamus, hypothalamus, amygdala","Frontal, parietal, occipital"],e:"Brainstem = midbrain, pons, medulla oblongata (controls basic life functions).",k:50},
{q:"The medulla oblongata controls:",c:"Basic life functions like breathing and heart rate",w:["Voluntary muscle movement","Long-term memory","Vision processing"],e:"The medulla drives involuntary functions \u2014 breathing, heart rate, blood pressure.",k:50},
/* ---- 51: CPAP ---- */
{q:"CPAP is indicated for a patient who is:",c:"Breathing but in respiratory distress (e.g., CHF, COPD exacerbation)",w:["Apneic","Vomiting actively","Hypotensive with SBP 80"],e:"CPAP = spontaneously breathing + distress (CHF, COPD, drowning). Not for apnea.",k:51},
{q:"CPAP is CONTRAINDICATED in a patient with:",c:"Pneumothorax",w:["CHF with crackles","COPD exacerbation","Anxiety"],e:"CPAP contraindications: hypotension, pneumothorax, facial trauma, vomiting, decreased LOC, apnea.",k:51},
{q:"How does CPAP help a CHF patient?",c:"Positive pressure keeps alveoli open and pushes fluid back, easing breathing",w:["It sedates the patient","It removes fluid from the lungs directly","It increases heart rate"],e:"CPAP splints airways open and improves oxygenation in pulmonary edema.",k:51},
/* ---- 52: AED ---- */
{q:"The FIRST step in using the AED is:",c:"Power on the AED",w:["Attach the pads","Deliver a shock","Start compressions"],e:"Power on \u2192 attach pads \u2192 clear/analyze \u2192 shock if advised \u2192 immediate CPR.",k:52},
{q:"AED pads are placed:",c:"Upper right chest and lower left ribs",w:["Both on the back","On the abdomen","On the forehead and chest"],e:"Upper-right chest, lower-left ribs (apex). Avoid nipples, meds patches, pacemakers.",k:52},
{q:"After the AED delivers a shock, you should:",c:"Immediately resume CPR for 2 minutes",w:["Check for a pulse for 30 seconds","Remove the pads","Wait for the next analysis"],e:"Shock \u2192 immediate CPR 2 min \u2014 don't pause to check pulses.",k:52},
{q:"The AED advises 'no shock.' You should:",c:"Resume CPR immediately",w:["Remove the pads","Shock anyway","Stop resuscitation"],e:"No shock advised = resume CPR immediately and transport.",k:52},
/* ---- 53: Stopping CPR ---- */
{q:"An EMT may stop CPR when:",c:"The medical director orders it",w:["The family asks","20 minutes have passed","The patient is elderly"],e:"Stop for: ROSC, transfer of care, physician/medical director order, exhaustion, unsafe scene, obvious death.",k:53},
{q:"You arrive to find rigor mortis and dependent lividity. You should:",c:"Not start CPR \u2014 these are definitive signs of death",w:["Start CPR immediately","Call for ALS to decide","Begin ventilations only"],e:"Rigor mortis + lividity = conclusive death; resuscitation is not indicated.",k:53},
/* ---- 54: Drowning ---- */
{q:"An infant can drown in:",c:"A bucket or bathtub with inches of water",w:["Only in pools or lakes","Only in deep water","Only with a head injury"],e:"Infants can drown in bathtubs, buckets, toilets, puddles \u2014 inches of water.",k:54},
/* ---- 55: Spiders ---- */
{q:"The two spiders with life-threatening bites in the US are:",c:"Black widow and brown recluse",w:["Wolf spider and tarantula","Garden spider and jumping spider","Orb weaver and cellar spider"],e:"Black widow (neurotoxic) and brown recluse (necrotic) are the dangerous two.",k:55},
{q:"A black widow bite characteristically causes:",c:"Severe muscle cramps and rigidity",w:["Immediate tissue necrosis","Painless swelling only","Delayed allergic rash"],e:"Black widow = painful muscle cramping/rigidity. Brown recluse = necrotic wound.",k:55},
/* ---- round 2: bring low-count competencies up ---- */
{q:"A patient has right arm drift and slurred speech but smiles symmetrically. The CPSS is:",c:"Abnormal \u2014 any one finding is abnormal",w:["Normal \u2014 two findings are needed","Unreliable in this patient","Only valid if all three are present"],e:"Any single abnormal CPSS finding (face, arms, speech) = abnormal, possible stroke.",k:5},
{q:"The Cincinnati scale is used to identify:",c:"Stroke",w:["Heart attack","Sepsis","Hypoglycemia"],e:"CPSS = prehospital stroke screen: facial droop, arm drift, speech.",k:5},
{q:"In a pregnant cardiac arrest, high-quality CPR is performed:",c:"With manual left uterine displacement throughout",w:["Only after delivery","At half the normal rate","With the patient on her side"],e:"Keep CPR standard + left uterine displacement; defibrillate if indicated.",k:8},
{q:"The primary focus in pregnant cardiac arrest is:",c:"Saving the mother",w:["Immediate field delivery","Fetal monitoring","Left-side transport only"],e:"Resuscitate the mother \u2014 maternal survival gives the fetus the best chance.",k:8},
{q:"Naloxone is best described as:",c:"An opiate antagonist that displaces opioids from brain receptors",w:["A respiratory stimulant for any overdose","A sedative for agitation","A vasopressor for shock"],e:"Naloxone displaces opioids from receptors; only works on opioid overdoses.",k:9},
{q:"Before giving oral glucose, you must confirm the patient:",c:"Is conscious and can swallow safely",w:["Has a high blood sugar","Is under 18","Has taken insulin today"],e:"Conscious + swallowing + no aspiration risk. Never oral glucose unconscious.",k:9},
{q:"A patient has partial-thickness burns to the anterior trunk and posterior trunk. This BSA is:",c:"36%",w:["18%","27%","9%"],e:"Anterior trunk 18% + posterior trunk 18% = 36% (any age).",k:11},
{q:"The rule of palms is most useful for:",c:"Scattered, patchy burns",w:["Full-body burns","Chemical eye exposures","Frostbite"],e:"Patient's palm \u2248 1% BSA \u2014 ideal for scattered burns.",k:11},
{q:"A pulse oximeter may be inaccurate with:",c:"Carbon monoxide poisoning",w:["Dehydration","Tachycardia","Hypertension"],e:"CO poisoning reads falsely normal. Also: poor perfusion, nail polish, motion.",k:12},
{q:"A normal pulse ox reading is:",c:"94\u2013100%",w:["80\u201385%","100\u2013105%","70\u201375%"],e:"Normal SpO2 = 94\u2013100%. Below 94% give oxygen (or if respiratory distress).",k:12},
{q:"During an emergency response in rain, you should:",c:"Slow down before standing water",w:["Speed up to push through","Brake hard while turning","Follow closely behind traffic"],e:"Slow early, avoid sudden inputs; standing water + speed = hydroplaning.",k:13},
{q:"Good tire tread matters in wet response because it:",c:"Channels water away to maintain road contact",w:["Increases fuel economy","Reduces siren noise","Cools the brakes"],e:"Tread disperses water; worn tires hydroplane easily.",k:13},
{q:"You arrive to a car on fire with a patient trapped inside. You should:",c:"Rapidly extricate due to immediate danger",w:["Wait for the fire crew while assessing vitals","Perform a full secondary assessment first","Splint injuries before moving"],e:"Fire/immediate danger = rapid extrication. Move fast, stabilize later.",k:15},
{q:"A pulseless patient in a wrecked car needs:",c:"Immediate rapid extrication and CPR",w:["Full spinal immobilization first","On-scene IV therapy","A detailed history"],e:"Cardiac arrest = rapid extrication; life threat beats spinal precautions.",k:15},
{q:"An epi auto-injector is used for:",c:"Anaphylaxis",w:["Asthma maintenance","Hypoglycemia","Seizures"],e:"Auto-injector = epinephrine for severe allergic reaction.",k:16},
{q:"A metered-dose inhaler delivers:",c:"Albuterol",w:["Naloxone","Epinephrine","Nitroglycerin"],e:"MDI = albuterol. Nebulizer = albuterol/ipratropium.",k:16},
{q:"Which drug is given by inhalation?",c:"Albuterol",w:["Aspirin","Glucose","Naloxone"],e:"Inhalation: oxygen, albuterol. Oral: aspirin, glucose, charcoal.",k:17},
{q:"Glucose is administered:",c:"Orally",w:["Intranasally","Sublingually","By inhalation"],e:"Glucose = oral (if conscious). Nitro = sublingual.",k:17},
{q:"A patient talking about suicide with a plan needs:",c:"Immediate safety measures and transport",w:["A pamphlet and discharge","A promise to call tomorrow","Family counseling on scene"],e:"Suicidal with plan/means = scene safety, never leave alone, transport.",k:21},
{q:"Which demographic has higher suicide rates?",c:"Older adult males",w:["Young children","Married women","Teenage girls only"],e:"Higher in males, older adults, and adolescents.",k:21},
{q:"During logrolling for SMR, movement is directed by:",c:"The person at the head",w:["The strongest provider","The patient","The driver"],e:"Head person calls the count \u2014 keeps the spine aligned.",k:22},
{q:"After securing a patient for SMR, you must:",c:"Re-check PMS",w:["Remove the C-collar","Loosen all straps","Sit them upright"],e:"PMS before and after splinting/securing \u2014 always.",k:22},
{q:"A newborn needs suctioning. You reach for the:",c:"Bulb syringe",w:["Oral airway","Magill forceps","Nasal cannula"],e:"Bulb syringe (or soft catheter) for newborns.",k:23},
{q:"Excessive suctioning of a newborn can cause:",c:"Bradycardia from vagal stimulation",w:["Hypertension","Fever","Seizures"],e:"Prolonged suction \u2192 vagal response \u2192 bradycardia. Suction briefly.",k:23},
{q:"The primary assessment comes:",c:"Before the secondary assessment",w:["After the detailed exam","Only for trauma patients","After transport begins"],e:"Order: scene size-up \u2192 primary \u2192 history \u2192 secondary \u2192 reassessment.",k:25},
{q:"A general impression is formed during the:",c:"Primary assessment",w:["Billing phase","Hospital triage","Reassessment only"],e:"Primary starts with general impression + LOC + ABCs.",k:25},
{q:"When entering an intersection against a red light, you:",c:"Stop and clear each lane before proceeding",w:["Proceed at normal speed","Turn off all warning devices","Honk continuously"],e:"Clear it \u2014 most serious ambulance crashes happen at intersections.",k:26},

/* ================= LOGIC ================= */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rint(0,a.length-1)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fp=v=>String(Math.round(v*100)/100);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
/* theme */
function setTheme(t){document.documentElement.setAttribute("data-theme",t);$("themeBtn").innerHTML=t==="dark"?"&#9788;":"&#9790;";try{localStorage.setItem("pep.theme",t);}catch(e){}}
$("themeBtn").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
try{if(localStorage.getItem("pep.theme")==="dark")setTheme("dark");}catch(e){}
/* nav */
document.querySelectorAll("nav.bottom button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav.bottom button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(b.dataset.v).classList.add("active");
  window.scrollTo(0,0);
});
/* ---------- STUDY ---------- */
let activeCat="";
function renderChips(){
  $("chips").innerHTML='<button class="chipbtn'+(activeCat===""?" on":"")+'" data-c="">All</button>'+
    CATS.map(c=>'<button class="chipbtn'+(activeCat===c?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+"</button>").join("");
  document.querySelectorAll(".chipbtn").forEach(b=>b.onclick=()=>{activeCat=b.dataset.c;renderChips();renderComps();});
}
function hi(t,q){
  if(!q)return esc(t);
  const i=t.toLowerCase().indexOf(q);
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+hi(t.slice(i+q.length),q);
}
function noteHTML(it){
  let h="";
  if(it.f)h+='<div class="note check"><b>&#9888; Check this</b>'+esc(it.f)+"</div>";
  if(it.d)h+='<div class="note added"><b>&#43; Added</b>'+esc(it.d)+"</div>";
  return h;
}
function renderComps(){
  const q=$("search").value.trim().toLowerCase();
  let html="";
  COMP.forEach(c=>{
    if(activeCat&&c.cat!==activeCat)return;
    const items=[];
    c.items.forEach(it=>{
      if(q&&!(it.t+" "+it.a+" "+(it.f||"")+" "+(it.d||"")).toLowerCase().includes(q))return;
      items.push('<div class="item"><p class="item-term">'+hi(it.t,q)+'</p><p class="item-ans">'+hi(it.a,q)+"</p>"+noteHTML(it)+"</div>");
    });
    if(q&&!items.length)return;
    html+='<div class="comp'+(q?" open":"")+'"><button class="comp-head"><span class="comp-num">'+c.n+'</span><span style="flex:1"><span class="comp-title">'+esc(c.title)+'</span><br><span class="comp-cat">'+esc(c.cat)+'</span></span><span class="chev">&#9660;</span></button><div class="comp-items">'+items.join("")+"</div></div>";
  });
  $("compList").innerHTML=html||'<div class="empty">No matches. Try another search.</div>';
  document.querySelectorAll(".comp-head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
}
$("search").addEventListener("input",renderComps);
/* ---------- FLASHCARDS ---------- */
let deck=[],di=0,deckIds=[];
function cardId(n,i){return n+":"+i;}
function getKnown(){const k=store("pep.known.v1");return k||{};}
function buildDeck(){
  const cat=$("deckSel").value;
  deck=[];
  COMP.forEach(c=>{
    if(cat&&c.cat!==cat)return;
    c.items.forEach((it,i)=>deck.push({id:cardId(c.n,i),n:c.n,term:it.t,ans:it.a,f:it.f,d:it.d}));
  });
  deck=shuffle(deck);di=0;renderCard();
}
function renderCard(){
  const known=getKnown();
  const total=deck.length;
  const knownCount=deck.filter(c=>known[c.id]).length;
  $("knownLine").textContent=knownCount+" of "+total+" known";
  if(!total){$("fNum").textContent="";$("fTerm").textContent="Deck empty";$("bAns").innerHTML="";return;}
  if(di>=total){$("fNum").textContent="\uD83C\uDF89";$("fTerm").textContent="Deck complete!";$("bAns").innerHTML="<p>Reset the deck to run it again.</p>";$("flip").classList.remove("back");return;}
  const c=deck[di];
  $("flip").classList.remove("back");
  $("fNum").textContent="Competency #"+c.n+" \u00b7 Card "+(di+1)+" of "+total;
  $("fTerm").textContent=c.term;
  $("bTerm").textContent=c.term;
  $("bAns").innerHTML="<p>"+esc(c.ans)+"</p>"+(c.f?'<div class="note check"><b>\u26a0 Check this</b>'+esc(c.f)+"</div>":"")+(c.d?'<div class="note added"><b>+ Added</b>'+esc(c.d)+"</div>":"");
}
$("flip").onclick=()=>$("flip").classList.toggle("back");
$("againBtn").onclick=()=>{if(di>=deck.length)return;const c=deck[di];deck.splice(Math.min(di+3,deck.length),0,c);di++;renderCard();};
$("gotitBtn").onclick=()=>{if(di>=deck.length)return;const k=getKnown();k[deck[di].id]=1;store("pep.known.v1",k);di++;renderCard();};
$("deckReset").onclick=()=>buildDeck();
$("deckSel").onchange=()=>buildDeck();
/* ---------- CALCULATION GENERATORS ---------- */
function mkOpts(correct,lo,hi){
  const cands=[];
  for(const d of[-2,-1,1,2]){const v=correct+d;if(v>=lo&&v<=hi&&cands.indexOf(v)<0)cands.push(v);}
  for(const d of[-3,3,-4,4]){if(cands.length>=3)break;const v=correct+d;if(v>=lo&&v<=hi&&cands.indexOf(v)<0)cands.push(v);}
  return shuffle(cands.slice(0,3)).map(String);
}
function genGCS(){
  const eye=[[4,"opens their eyes on their own and looks around"],[3,"opens their eyes when you call their name loudly"],[2,"only opens their eyes when you press hard on a nail bed"],[1,"does not open their eyes to anything you do"]];
  const verb=[[5,"answers your questions correctly and knows where they are"],[4,"is talking but is confused about where they are"],[3,"says random words that don't fit the conversation"],[2,"only moans and groans \u2014 no real words"],[1,"makes no sounds at all"]];
  const mot=[[6,"squeezes your hand when you ask them to"],[5,"reaches toward where it hurts and pushes your hand away"],[4,"pulls their arm away when you pinch them"],[3,"their arms curl toward their chest when you pinch (decorticate)"],[2,"their arms stiffen and straighten outward when you pinch (decerebrate)"],[1,"does not move at all, even to pain"]];
  const e=pick(eye),v=pick(verb),m=pick(mot),total=e[0]+v[0]+m[0];
  return{q:"GCS: Your patient "+e[1]+". They "+v[1]+". When you apply a painful stimulus, "+m[1]+". What is the total GCS score?",
    c:String(total),w:mkOpts(total,3,15),e:"Eye "+e[0]+" + Verbal "+v[0]+" + Motor "+m[0]+" = "+total+".",k:24,cat:"Calculations"};
}
function genApgar(){
  const min=pick([1,5]);
  const app=pick([[2,"completely pink all over"],[1,"pink body with blue hands and feet"],[0,"pale and blue all over"]]);
  const pul=pick([[2,112],[2,124],[1,96],[1,88],[1,98],[2,104],[0,0]]);
  const gri=pick([[2,"cries loudly when suctioned"],[1,"makes only a weak grimace when stimulated"],[0,"shows no reaction at all"]]);
  const act=pick([[2,"moving arms and legs actively"],[1,"slight flexion of the limbs"],[0,"limp with no movement"]]);
  const res=pick([[2,"a strong cry"],[1,"slow, irregular breathing"],[0,"not breathing"]]);
  const total=app[0]+pul[0]+gri[0]+act[0]+res[0];
  const hrTxt=pul[1]===0?"no heartbeat can be felt":"a heart rate of "+pul[1];
  return{q:"Apgar at "+min+" minute"+(min>1?"s":"")+": the newborn is "+app[1]+", has "+hrTxt+", "+gri[1]+", is "+act[1]+", and has "+res[1]+". What is the Apgar score?",
    c:String(total),w:mkOpts(total,0,10),e:"Appearance "+app[0]+" + Pulse "+pul[0]+" + Grimace "+gri[0]+" + Activity "+act[0]+" + Respiration "+res[0]+" = "+total+".",k:20,cat:"Calculations"};
}
const BURN_PCT={adult:{head:9,antTrunk:18,postTrunk:18,arm:9,leg:18,gen:1},child:{head:12,antTrunk:18,postTrunk:18,arm:9,leg:16.5,gen:1},infant:{head:18,antTrunk:18,postTrunk:18,arm:9,leg:13.5,gen:1}};
function genBurn(){
  const age=pick(["adult","child","infant"]),P=BURN_PCT[age];
  const pool=[
    {id:"head",base:"head",label:"the entire head",pct:P.head},
    {id:"face",base:"head",label:"the face only",pct:P.head/2},
    {id:"antTrunk",base:"antTrunk",label:"the entire front of the torso",pct:P.antTrunk},
    {id:"chest",base:"antTrunk",label:"the chest only",pct:9},
    {id:"postTrunk",base:"postTrunk",label:"the entire back",pct:P.postTrunk},
    {id:"armL",base:"armL",label:"the entire left arm",pct:P.arm},
    {id:"armR",base:"armR",label:"the entire right arm",pct:P.arm},
    {id:"armLfront",base:"armL",label:"the front of the left arm",pct:P.arm/2},
    {id:"armRback",base:"armR",label:"the back of the right arm",pct:P.arm/2},
    {id:"legL",base:"legL",label:"the entire left leg",pct:P.leg},
    {id:"legR",base:"legR",label:"the entire right leg",pct:P.leg},
    {id:"legLfront",base:"legL",label:"the front of the left leg",pct:P.leg/2},
    {id:"legRback",base:"legR",label:"the back of the right leg",pct:P.leg/2},
    {id:"gen",base:"gen",label:"the genital area",pct:P.gen}];
  const used=new Set(),chosen=[];
  const want=rint(3,4);
  for(const r of shuffle(pool)){if(chosen.length>=want)break;if(used.has(r.id)||used.has(r.base))continue;chosen.push(r);used.add(r.id);used.add(r.base);}
  const sups=shuffle(pool.filter(r=>!used.has(r.id)&&!used.has(r.base)));
  const sup=sups[0];
  let correct=Math.round(chosen.reduce((s,r)=>s+r.pct,0)*100)/100;
  const trap=Math.round((correct+sup.pct)*100)/100;
  const wset=[];
  const pushW=v=>{v=Math.round(v*100)/100;if(v>0&&v<=100&&v!==correct&&wset.indexOf(fp(v))<0)wset.push(fp(v));};
  pushW(trap);
  shuffle([9,4.5,13.5,18]).forEach(d=>{pushW(correct+d);pushW(correct-d);});
  const wrong=wset.slice(0,3).map(String);
  const list=chosen.map(r=>r.label).join(", ");
  return{q:"Rule of nines \u2014 "+age+" patient with partial-thickness burns to "+list+". There is also a superficial (first-degree) burn to "+sup.label+". What is the total burn BSA percentage?",
    c:fp(correct),w:wrong,e:"Add: "+chosen.map(r=>r.label+" "+fp(r.pct)+"%").join(" + ")+" = "+fp(correct)+"%. The superficial burn to "+sup.label+" ("+fp(sup.pct)+"%) does NOT count \u2014 "+fp(trap)+"% is the trap answer.",k:10,cat:"Calculations"};
}
function genCalc(){const t=rint(0,2);return t===0?genGCS():t===1?genApgar():genBurn();}
/* ---------- TEST ENGINE ---------- */
const compCat={};COMP.forEach(c=>compCat[c.n]=c.cat);
let T=null;
function catOf(q){return q.cat||compCat[q.k]||"";}
function startTest(mode){
  let qs=[];
  if(mode==="quick"){qs=shuffle(QUESTIONS).slice(0,25);for(let i=0;i<5;i++)qs.push(genCalc());qs=shuffle(qs);}
  else if(mode==="full"){qs=shuffle(QUESTIONS).slice();for(let i=0;i<15;i++)qs.push(genCalc());qs=shuffle(qs);}
  else if(mode==="calc"){for(let i=0;i<20;i++)qs.push(genCalc());}
  else if(mode==="missed"){qs=store("pep.missed.v1")||[];if(!qs.length){alert("No missed questions yet \u2014 take a test first.");return;}qs=shuffle(qs);}
  T={qs:qs,idx:0,score:0,missed:[],mode:mode,lock:false,catScore:{},catTotal:{}};
  qs.forEach(q=>{const c=catOf(q);T.catTotal[c]=(T.catTotal[c]||0)+1;});
  $("modePick").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");
  renderQ();window.scrollTo(0,0);
}
function renderQ(){
  const q=T.qs[T.idx];
  $("pfill").style.width=Math.round(T.idx/T.qs.length*100)+"%";
  $("qcount").textContent="Question "+(T.idx+1)+" of "+T.qs.length;
  $("qscore").textContent="Score: "+T.score;
  $("qtext").textContent=q.q;
  const opts=shuffle([{t:q.c,ok:true}].concat(q.w.map(t=>({t:t,ok:false}))));
  $("opts").innerHTML=opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o.t)+"</button>").join("");
  $("explain").classList.add("hidden");$("nextBtn").classList.add("hidden");
  T.lock=false;T.curOpts=opts;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  if(!T||T.lock)return;T.lock=true;
  const q=T.qs[T.idx],o=T.curOpts[i],cat=catOf(q);
  T.catScore[cat]=T.catScore[cat]||0;
  document.querySelectorAll(".opt").forEach((b,bi)=>{
    b.disabled=true;
    if(T.curOpts[bi].ok)b.classList.add("correct");
  });
  if(o.ok){T.score++;T.catScore[cat]++;}
  else{
    document.querySelectorAll(".opt")[i].classList.add("wrong");
    T.missed.push({q:q,mine:o.t});
    const bank=store("pep.missed.v1")||[];
    if(!bank.some(b=>b.q===q.q)){bank.push({q:q.q,c:q.c,w:q.w,e:q.e,k:q.k,cat:cat});store("pep.missed.v1",bank);}
  }
  $("qscore").textContent="Score: "+T.score;
  $("explain").innerHTML='<span class="comp-tag">Competency #'+q.k+"</span><br>"+esc(q.e);
  $("explain").classList.remove("hidden");
  const last=T.idx>=T.qs.length-1;
  $("nextBtn").textContent=last?"See results":"Next";
  $("nextBtn").classList.remove("hidden");
  window.scrollTo(0,0);
}
$("nextBtn").onclick=()=>{T.idx++;if(T.idx>=T.qs.length)showResults();else renderQ();};
$("endBtn").onclick=()=>{if(T)showResults();};
function showResults(){
  $("quiz").classList.add("hidden");
  const total=T.qs.length,pct=total?Math.round(T.score/total*100):0;
  if(T.mode==="full"){const best=store("pep.best.v1")||0;if(pct>best)store("pep.best.v1",pct);}
  const cats=Object.keys(T.catTotal).map(c=>({c:c,pct:Math.round((T.catScore[c]||0)/T.catTotal[c]*100),n:T.catTotal[c]})).sort((a,b)=>a.pct-b.pct);
  let h='<div class="bigpct">'+pct+'%</div><p class="bestline">'+T.score+" of "+total+" correct</p>";
  h+="<h3 class='cond'>Score by category \u2014 weakest first</h3>";
  cats.forEach(c=>{
    const col=c.pct<70?"var(--bad)":c.pct<90?"var(--check-line)":"var(--good)";
    h+='<div class="catbar"><div class="lbl"><span>'+esc(c.c)+'</span><span>'+c.pct+'% ('+c.n+')</span></div><div class="track"><div class="fill" style="width:'+c.pct+'%;background:'+col+'"></div></div></div>';
  });
  if(T.missed.length){
    h+="<h3 class='cond'>Missed questions ("+T.missed.length+")</h3>";
    T.missed.forEach(m=>{
      h+='<div class="missed"><p class="mq">'+esc(m.q.q)+'</p><p class="ma">Your answer: <b>'+esc(m.mine)+'</b></p><p class="ma ok">Correct: <b>'+esc(m.q.c)+'</b></p><p class="ma">'+esc(m.q.e)+' <span class="comp-tag" style="display:inline-block;background:var(--red);color:#fff;font-size:.75rem;font-weight:700;border-radius:8px;padding:2px 8px;">#'+m.q.k+"</span></p></div>";
    });
  }else h+="<p class='bestline'>Flawless. Nothing missed.</p>";
  h+='<div class="qnav"><button class="btn primary" onclick="backToModes()">Back to test menu</button></div>';
  $("results").innerHTML=h;$("results").classList.remove("hidden");
  T=null;window.scrollTo(0,0);
}
function backToModes(){$("results").classList.add("hidden");$("modePick").classList.remove("hidden");showBest();}
function showBest(){const b=store("pep.best.v1");$("bestLine").textContent=b?("Best full-exam score: "+b+"%"):"No full exam taken yet.";}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>startTest(b.dataset.mode));
/* init */
(function(){
  const sel=$("deckSel");
  sel.innerHTML='<option value="">All categories</option>'+CATS.map(c=>'<option value="'+esc(c)+'">'+esc(c)+"</option>").join("");
  renderChips();renderComps();buildDeck();showBest();
})();
</script>
