name: Check

# Runs on every push and pull request. A red X here means the push would break
# something for users: duplicate card ids, a file missing from the offline cache,
# a JS file that doesn't parse, or app files changed without bumping sw.js VERSION.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pre-deploy checks
        run: node tools/check.js --base ${{ github.event.before && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1' }}
